<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scalar</title>
    <style>
      /* A5 layout (issue #89): report-forward. A full-width top bar carries delivery; the report
         is the primary surface (terminal-styled); files are a compact manifest; the code preview
         is on demand — it opens by growing the plugin window (see App.tsx / figma.ui.resize).
         Themed via Figma's design-system CSS variables (injected when showUI has themeColors:true);
         fallbacks keep it legible outside Figma. NOTE: the plugin iframe has no network, so the
         JetBrains-Mono decision can't be a webfont here — it needs the file embedded. Until then the
         monospace surfaces use the system mono stack (--mono). */
      :root {
        color-scheme: light dark;
        --panel: var(--figma-color-bg, #ffffff);
        --rail: var(--figma-color-bg, #ffffff);
        --sunk: var(--figma-color-bg, #ffffff);
        --line: var(--figma-color-border, #e6e6e6);
        --txt: var(--figma-color-text, #1e1e1e);
        --txt2: var(--figma-color-text-secondary, #6e6e6e);
        --txt3: var(--figma-color-text-tertiary, #b2b2b2);
        --bg2: var(--figma-color-bg-secondary, #f5f5f5);
        --hover: var(--figma-color-bg-hover, #ebebeb);
        --sel: var(--figma-color-bg-selected, #e5f1ff);
        --brand: var(--figma-color-bg-brand, #0d99ff);
        --brand-hover: var(--figma-color-bg-brand-hover, #007be5);
        --onbrand: var(--figma-color-text-onbrand, #ffffff);
        --brandtext: var(--figma-color-text-brand, #007be5);
        --ok: var(--figma-color-text-success, #009951);
        --warn: var(--figma-color-text-warning, #a56b00);
        --danger: var(--figma-color-text-danger, #e03e1a);
        --num: #8b5cf6;
        --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
        --ctl-h: 30px;
        /* Two-tone surfaces: content panels #fff, chrome strips a touch sunk. In light these derive
           from Figma's own tokens; dark gets explicit steps (Figma has no "darker than bg" token). */
        --strip: var(--figma-color-bg-secondary, #fafbfc);
      }
      .figma-dark { --rail: #242424; --sunk: #191919; --strip: #212121; --num: #c99bff; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--panel);
        color: var(--txt);
        font-family: Inter, system-ui, sans-serif;
        font-size: 11px;
        -webkit-font-smoothing: antialiased;
      }
      #root { height: 100vh; }
      button, select, input, textarea { font-family: inherit; font-size: 11px; color: var(--txt); }

      /* Grid: full-width top bar; left column = report / files / footer; right column = on-demand
         preview spanning all three left rows. The report column is a fixed width and the window
         grows (--preview-w: 0 -> the preview width) to reveal the editor, so opening output never
         halves the report. */
      .app {
        display: grid;
        grid-template-columns: 500px var(--preview-w, 0px);
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        grid-template-areas:
          "top    top"
          "report preview"
          "files  preview"
          "foot   preview";
        height: 100vh;
        overflow: hidden;
      }

      /* top bar: delivery (left) + debug theme + settings gear (right) */
      .topbar { grid-area: top; display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
      .btn { height: var(--ctl-h); display: inline-flex; align-items: center; font: inherit; border-radius: 6px; padding: 0 13px; cursor: pointer; border: 1px solid var(--line); background: var(--bg2); color: var(--txt); white-space: nowrap; }
      .btn:hover:not(:disabled) { background: var(--hover); }
      .btn:disabled { opacity: 0.45; cursor: default; }
      .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--onbrand); font-weight: 500; }
      .btn.primary:hover:not(:disabled) { background: var(--brand-hover); }
      .btn.sm { height: auto; padding: 3px 10px; }
      .spring { flex: 1; }
      .iconbtn { height: var(--ctl-h); width: var(--ctl-h); display: inline-flex; align-items: center; justify-content: center; background: none; border: 1px solid transparent; color: var(--txt2); cursor: pointer; border-radius: 6px; flex: none; }
      .iconbtn:hover:not(:disabled) { background: var(--bg2); color: var(--txt); }
      .iconbtn:disabled { opacity: 0.4; cursor: default; }
      .iconbtn.bordered { border-color: var(--line); background: var(--bg2); }
      .iconbtn.bordered:hover:not(:disabled) { background: var(--hover); }

      /* debug theme segmented (throwaway; deleted at ship with DebugThemeToggle) */
      .seg { height: var(--ctl-h); display: inline-flex; align-items: stretch; padding: 2px; gap: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg2); }
      .seg button { border: 0; background: none; border-radius: 4px; padding: 0 10px; cursor: pointer; color: var(--txt2); font: inherit; }
      .seg button[aria-pressed="true"] { background: var(--panel); color: var(--txt); font-weight: 500; box-shadow: 0 1px 1px rgba(0,0,0,0.06); }
      .seg .lead { align-self: center; color: var(--txt3); font-family: var(--mono); font-size: 10px; padding: 0 4px 0 6px; }

      /* report (primary) */
      .report { grid-area: report; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
      .rhead { display: flex; align-items: center; gap: 7px; min-height: 40px; padding: 6px 12px; font-family: var(--mono); color: var(--txt2); border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
      .rscroll { flex: 1; min-height: 0; overflow: auto; }
      .rhead .rdot { width: 7px; height: 7px; border-radius: 50%; background: var(--txt3); flex: none; }
      .rhead .rdot.ok { background: var(--ok); } .rhead .rdot.warn { background: var(--warn); } .rhead .rdot.err { background: var(--danger); }
      .rhead b { color: var(--txt); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
      .rhead .sep { color: var(--txt3); flex: none; }
      /* inline glyph counts folded into the header (not badges) */
      .rhead .counts { display: inline-flex; gap: 9px; flex: none; font-variant-numeric: tabular-nums; }
      .rhead .counts .c-err { color: var(--danger); } .rhead .counts .c-warn { color: var(--warn); } .rhead .counts .c-ok { color: var(--brandtext); }
      .copybtn { margin-left: auto; font: inherit; border: 1px solid var(--line); background: var(--bg2); color: var(--txt); border-radius: 6px; padding: 3px 10px; cursor: pointer; flex: none; }
      .copybtn:hover { background: var(--hover); }
      .rbody { padding: 2px 12px 14px; }
      .gh { font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--txt3); margin: 12px 0 3px; }
      .gh::before { content: "# "; }
      .rl { font-family: var(--mono); line-height: 1.5; padding: 3px 0 3px 15px; text-indent: -15px; color: var(--txt); }
      .rl.k-err::before { content: "✗ "; color: var(--danger); }
      .rl.k-guess::before { content: "! "; color: var(--warn); }
      .rl.k-conv::before { content: "✓ "; color: var(--brandtext); }
      .rl-names { color: #e01e5a; background: var(--bg2); border: 1px solid var(--line); padding: 0 5px; border-radius: 4px; }
      .figma-dark .rl-names { color: #d9993e; }
      .rl-aside { color: var(--txt2); }
      .figma-dark .rl-aside { color: var(--txt3); }

      /* report — cold open + compiler (clean/error) */
      /* live terminal: command echo + working dots, streaming caret, clean lines, end marker */
      .cmd { font-family: var(--mono); color: var(--txt2); padding: 2px 0; }
      .cmd .dots::after { content: "…"; }
      .cmd.run .dots::after { animation: dots 1s steps(4) infinite; }
      @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "…"; } 100% { content: "…"; } }
      @keyframes blink { 50% { opacity: 0; } }
      .rbody .ok { color: var(--ok); } .rbody .err { color: var(--danger); }
      .cl { font-family: var(--mono); line-height: 1.5; padding: 3px 0; color: var(--txt); }
      .curline { padding: 2px 0; }
      .streamcur { display: inline-block; width: 7px; height: 12px; background: var(--txt2); vertical-align: -2px; animation: blink 1.1s steps(1) infinite; }
      .doneline { font-family: var(--mono); color: var(--txt3); padding: 10px 0 0; }

      /* cold open — centered SCALAR banner (decrypts in) + tagline + connected / awaiting */
      .coldopen { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; transition: opacity 0.18s ease; }
      .coldopen.out { opacity: 0; }
      .art { font-family: var(--mono); font-size: 11px; line-height: 1.05; white-space: pre; color: var(--brandtext); margin: 0; }
      .tagline { font-family: var(--mono); font-size: 11px; color: var(--txt3); }
      .caret { font-family: var(--mono); font-size: 11px; color: var(--txt2); text-align: center; line-height: 1.7; }
      .caret .sep { color: var(--txt3); }
      .caret b { color: var(--txt); font-weight: 500; }
      .caret .await { color: var(--txt3); }
      .cur { display: inline-block; width: 6px; height: 12px; margin-left: 3px; background: var(--ok); vertical-align: -2px; animation: blink 1.1s steps(1) infinite; }
      /* Tier-2 fatal (#101): terminal output in the report stream, NOT a boxed card. A git-style
         `fatal:` keyword marks it (deliberately not a ✗ — no glyph overload with the couldn't-export
         lines); guidance is dimmed like an aside; raw detail is a collapsible block; and the run
         closes on `— export aborted`, mirroring the clean run's `— end of report`. */
      .rl-fatal { font-family: var(--mono); line-height: 1.5; padding: 3px 0; color: var(--txt); }
      .fatal-kw { color: var(--danger); font-weight: 600; }
      .fatal-note { font-family: var(--mono); line-height: 1.5; color: var(--txt2); padding: 2px 0 3px 15px; white-space: pre-wrap; }
      .figma-dark .fatal-note { color: var(--txt3); }
      .fatal-detail { font-family: var(--mono); padding: 4px 0 0 15px; }
      .fatal-detail summary { color: var(--txt3); cursor: pointer; user-select: none; list-style-position: outside; }
      .fatal-detail pre { margin: 6px 0 0; padding: 8px; background: var(--bg2); border: 1px solid var(--line); border-radius: 4px; color: var(--txt2); white-space: pre-wrap; word-break: break-word; }
      .doneline-fatal { color: var(--danger); }

      /* files manifest — a compact list. Hidden entirely until an export produces files; then the
         whole panel slides in from height 0 (see .files.opening + FilesManifest). Its opened height
         is set inline — floored so one file isn't cramped, capped so a long list scrolls inside. */
      .files { grid-area: files; background: var(--strip); border-right: 1px solid var(--line); border-top: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
      .fhead { display: flex; align-items: center; gap: 8px; padding: 7px 8px 6px 12px; color: var(--txt2); font-family: var(--mono); font-size: 10.5px; flex: none; }
      .fhead .spring { flex: 1; }
      .fhead .iconbtn { height: 30px; width: 30px; }
      .flist { flex: 1; overflow: auto; min-height: 0; padding: 0 6px 6px; }
      .frow { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; cursor: pointer; padding: 6px 8px; border-radius: 5px; color: var(--txt); }
      /* Hover: a translucent overlay, not Figma's --bg-hover token — on this secondary-background
         panel that token only shifts ~1 shade and reads as no hover at all in light (#119). The
         overlay composites over the panel for a clearly visible, theme-correct step in both modes. */
      .frow:hover { background: rgba(0, 0, 0, 0.10); }
      .figma-dark .frow:hover { background: rgba(255, 255, 255, 0.10); }
      .frow[aria-current="true"] { background: var(--sel); }
      .frow[aria-current="true"] .fname { color: var(--brandtext); font-weight: 500; }
      .ficon { width: 13px; height: 13px; flex: none; color: var(--txt3); }
      .fname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .fsize { flex: none; color: var(--txt3); font-family: var(--mono); font-size: 10px; font-variant-numeric: tabular-nums; }

      /* preview (on-demand) — the report column stays put; this reveals as the window widens */
      .preview { grid-area: preview; background: var(--sunk); display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
      .pvhd { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--panel); color: var(--txt2); }
      .fname-hd { font-family: var(--mono); color: var(--txt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .searchrow { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
      .search { font: inherit; background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; color: var(--txt); flex: 1; min-width: 0; }
      .search:focus { outline: none; border-color: var(--brand); }
      .search::placeholder { color: var(--txt3); }
      .matchnav { color: var(--txt3); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 46px; text-align: right; }
      .navbtn { font: inherit; background: var(--bg2); border: 1px solid var(--line); border-radius: 5px; width: 22px; height: 22px; padding: 0; cursor: pointer; color: var(--txt2); flex: none; }
      .navbtn:hover:not(:disabled) { background: var(--hover); }
      .navbtn:disabled { opacity: 0.4; cursor: default; }
      .code { flex: 1; overflow: auto; min-height: 0; margin: 0; padding: 8px 0 12px; font-family: var(--mono); font-size: 11.5px; line-height: 1.6; background: var(--sunk); transition: opacity 0.1s ease-out; }
      .cline { display: flex; }
      .cline .gutter { width: 44px; flex: none; text-align: right; padding-right: 12px; color: var(--txt3); user-select: none; }
      .cline .ctext { white-space: pre; padding-right: 12px; }
      .code .k { color: var(--brandtext); } .code .s { color: var(--ok); } .code .a { color: var(--warn); }
      .code .n, .code .b { color: var(--num); } .code .p { color: var(--txt3); }
      .code mark { background: var(--figma-color-bg-warning, #ffd84d); color: #1e1e1e; border-radius: 2px; }
      .code mark.matchcur { background: var(--brand); color: var(--onbrand); }
      .pvfoot { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-top: 1px solid var(--line); background: var(--panel); color: var(--txt3); font-family: var(--mono); font-size: 10px; font-variant-numeric: tabular-nums; transition: opacity 0.1s ease-out; }
      .pvempty { flex: 1; display: grid; place-content: center; justify-items: center; gap: 6px; text-align: center; color: var(--txt3); padding: 24px; transition: opacity 0.1s ease-out; }
      .pvempty .big { color: var(--txt2); }
      /* Fade the centered empty-state copy while the window resizes so it doesn't visibly re-wrap. */
      .app.animating .pvempty { opacity: 0; }
      /* Hide the stats footer during the resize too (issue #93): its `·`-separated counts otherwise
         re-flow as the preview column changes width. Fades back in on settle like .code / .pvempty. */
      .app.animating .pvfoot { opacity: 0; }
      /* THE perf lever (issue #93): take the (potentially huge) code subtree out of rendering while
         the window resizes — otherwise every open/close frame reflows/repaints every line. It snaps
         out for the ~280ms resize and fades back in (opacity transition on .code) once .animating
         clears and the window has settled. Do not drop this rule; without it large files lag again. */
      .app.animating .code { content-visibility: hidden; opacity: 0; }

      /* master footer — DTCG + plugin version, contained to the left column */
      .foot { grid-area: foot; display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 12px; border-top: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--panel); color: var(--txt3); font-size: 10px; }
      .foot a { color: var(--brandtext); text-decoration: none; }
      .foot a:hover { text-decoration: underline; }
      .foot .ver { margin-left: auto; font-variant-numeric: tabular-nums; font-family: var(--mono); }
      .foot .dlerr { color: var(--danger); }

      /* ---- arrival motion — the report streams (ReportPanel); the files panel opens then its rows print in (FilesManifest); all off under reduced-motion ---- */
      @keyframes sweepText { from { background-position: 100% 0; } to { background-position: -60% 0; } }
      /* the whole files panel (header + list) slides in from height 0 in one motion; then the rows
         print in crisply (a hard cut per row via .pending). The opened height is set inline. */
      .files.opening { transition: height 300ms cubic-bezier(0, 0, 0.2, 1); }
      .frow.pending { visibility: hidden; }
      /* one green sweep across the clean "export complete" text */
      .sweep {
        background: linear-gradient(100deg, var(--ok) 0 40%, #a6f0c6 50%, var(--ok) 60% 100%);
        background-size: 250% 100%; background-position: 100% 0;
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        animation: sweepText 0.9s ease 0.15s both;
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
        /* keep the sweep line plainly readable when its animation is suppressed */
        .sweep { -webkit-text-fill-color: var(--ok); background: none; }
      }
    </style>
